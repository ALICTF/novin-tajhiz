# استقرار کامل نوین تجهیز: اپ + دیتابیس.
#
# روی سرور اختصاصی (پارس‌پک) این فایل به‌تنهایی کافی است:
#   docker compose up -d --build
#
# روی لیارا معمولاً دیتابیس را جدا و مدیریت‌شده می‌گیرید؛ آنجا فقط ایمیج اپ
# لازم است و DATABASE_URL را از پنل لیارا ست می‌کنید.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novin}
      POSTGRES_DB: ${POSTGRES_DB:-novintajhiz}
      # ترتیب مرتب‌سازی فارسی و پشتیبانی درست از یونیکد.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    # پورت عمداً به بیرون منتشر نمی‌شود؛ فقط اپ داخل شبکه به آن دسترسی دارد.
    # برای اتصال از بیرون (مثلاً توسعه محلی) خط زیر را باز کنید.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novin} -d ${POSTGRES_DB:-novintajhiz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novin}:${POSTGRES_PASSWORD:-novin}@db:5432/${POSTGRES_DB:-novintajhiz}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?رمز پنل مدیریت را در فایل .env تنظیم کنید}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?کلید امضای نشست را در فایل .env تنظیم کنید}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Tehran
      # آدرس نهایی سایت. در فید ترب، sitemap و تگ‌های اشتراک‌گذاری استفاده
      # می‌شود، پس اگر اشتباه باشد ترب محصولات را پیدا نمی‌کند.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://novintajhiz.org}
      # پیامک کاوه‌نگار — خالی بماند تا زمانی که حساب آماده شود.
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      ADMIN_SMS_RECIPIENT: ${ADMIN_SMS_RECIPIENT:-}
      # اگر فضای ابری S3 دارید، این‌ها را پر کنید تا آپلودها آنجا بروند.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # آپلودها بیرون از ایمیج می‌مانند تا با هر استقرار پاک نشوند.
      - uploads:/app/uploads

  # --------------------------- پشتیبان‌گیری ---------------------------
  # ایمیج پستگرس استفاده می‌شود چون pg_dump را از قبل دارد و نسخه‌اش دقیقاً
  # با سرور می‌خواند — pg_dump قدیمی‌تر از سرور کار نمی‌کند.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novin}:${POSTGRES_PASSWORD:-novin}@db:5432/${POSTGRES_DB:-novintajhiz}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      TZ: Asia/Tehran
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./docker/backup-entrypoint.sh:/backup-entrypoint.sh:ro
      # فقط‌خواندنی سوار می‌شود: سرویس پشتیبان هیچ دلیلی برای نوشتن در
      # فایل‌های واقعی ندارد.
      - uploads:/uploads:ro
      # نسخه‌ها روی خود سرور می‌مانند تا با docker compose down پاک نشوند.
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup-entrypoint.sh"]

volumes:
  db-data:
  uploads:
